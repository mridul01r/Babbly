<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 1 Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Task 1: Main heading and paragraphs -->
  <h1>Welcome to My Webpage</h1>
  <p>This is the first paragraph.</p>
  <p>This is the second paragraph.</p>

  <!-- Task 2: Image with caption -->
  <div class="center">
    <img src="images/rem.jpg" alt="Sample Image">
    <p>This is a caption for the image.</p>
  </div>

  <!-- Task 4: Styled button -->
  <button class="styled-button">Click Me</button>

  <!-- Task 5: Table and form -->
  <h2>Simple Table</h2>
  <table border="1">
    <tr>
      <th>Column 1</th>
      <th>Column 2</th>
      <th>Column 3</th>
    </tr>
    <tr>
      <td>Row 1, Cell 1</td>
      <td>Row 1, Cell 2</td>
      <td>Row 1, Cell 3</td>
    </tr>
    <tr>
      <td>Row 2, Cell 1</td>
      <td>Row 2, Cell 2</td>
      <td>Row 2, Cell 3</td>
    </tr>
  </table>

  <h2>Basic Form</h2>
  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
